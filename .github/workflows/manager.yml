name: Manager platforms

on:
  pull_request:
    paths:
      - 'crates/wrathplus-manager/**'
      - 'crates/wrathplus-mpq/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/manager.ps1'
      - '.github/workflows/manager.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manager:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      WOW_DATA: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: manager
      - name: Tests (synthetic assets, no display or game launch)
        run: cargo test --locked -p wrathplus-manager
      - name: Strict Clippy
        run: cargo clippy --locked -p wrathplus-manager --all-targets -- -D warnings
      - name: Build Manager
        run: cargo build --locked -p wrathplus-manager
      - name: CLI help
        run: cargo run --locked -p wrathplus-manager -- --help
      - name: PowerShell bootstrap syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/manager.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
