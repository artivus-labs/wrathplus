# Services that run beside a realm: the beta account service (services/account).
name: Services

on:
  push:
    paths:
      - "services/**"
      - ".github/workflows/services.yml"
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/services.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/account
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
