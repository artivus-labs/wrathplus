<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WrathPlus agent view</title>
<style>
  :root {
    --bg: #0b1018; --panel: #141c28; --line: #243246; --text: #dde7f1; --muted: #8b9fb4;
    --gold: #dfb96d; --ice: #85bfde; --hp: #3fa34d; --mana: #3d6fd6; --bad: #d65a4a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; letter-spacing: .14em; text-transform: uppercase;
              color: var(--gold); font-weight: 600; }
  .badge { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line);
           color: var(--muted); font-size: 12px; }
  .badge.live { color: var(--ice); border-color: #2f5670; }
  .badge.off { color: var(--bad); border-color: #6b2c25; }
  header .spacer { flex: 1; }
  header label { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px 20px; }
  .frame { position: relative; background: #000; border: 1px solid var(--line); border-radius: 6px;
           overflow: hidden; aspect-ratio: 16 / 9; }
  .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .frame .fps { position: absolute; right: 10px; bottom: 8px; font: 12px ui-monospace, monospace;
                color: var(--muted); background: #0009; padding: 2px 6px; border-radius: 4px; }
  aside { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .card h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
             color: var(--muted); font-weight: 600; }
  .who { font-size: 20px; color: var(--gold); }
  .sub { color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: #0d131c; margin: 6px 0 2px; overflow: hidden; }
  .bar > div { height: 100%; }
  .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; height: 340px; overflow-y: auto;
         margin: 0; padding: 0; list-style: none; }
  .log li { padding: 3px 0; border-bottom: 1px solid #1b2636; word-break: break-word; }
  .log .ev { color: var(--ice); }
  .log .lua { color: var(--gold); }
  .log .err { color: var(--bad); }
  .log .t { color: #5d6f83; margin-right: 6px; }
  input[type=search] { width: 100%; background: #0d131c; color: var(--text); border: 1px solid var(--line);
                       border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>WrathPlus · agent view</h1>
  <span id="state" class="badge">connecting</span>
  <span class="spacer"></span>
  <label>Resolution
    <select id="scale">
      <option value="1" selected>full</option>
      <option value="0.5">half (lighter on the client)</option>
    </select>
  </label>
</header>
<main>
  <div class="frame"><img id="frame" alt="What the agent sees"><span id="fps" class="fps">–</span></div>
  <aside>
    <section class="card">
      <h2>Character</h2>
      <div id="who" class="who">–</div>
      <div id="where" class="sub">–</div>
      <div class="bar"><div id="hp" style="background: var(--hp); width: 0"></div></div>
      <div class="row"><span>Health</span><span id="hpText">–</span></div>
      <div class="bar"><div id="pw" style="background: var(--mana); width: 0"></div></div>
      <div class="row"><span>Power</span><span id="pwText">–</span></div>
      <div class="row" style="margin-top: 8px"><span>Target</span><span id="target">–</span></div>
    </section>
    <section class="card">
      <h2>Agent Lua and game events</h2>
      <input id="filter" type="search" placeholder="Filter, e.g. CHAT or AGENT_LUA">
      <ul id="log" class="log"></ul>
    </section>
  </aside>
</main>
<script>
// Read-only: this page only reads the port. The token was given in the address bar.
const TOKEN = __TOKEN__;
const headers = { Authorization: "Bearer " + TOKEN };
const $ = (id) => document.getElementById(id);
const get = (path) => fetch(path, { headers });

// A capture waits a few rendered frames for its GPU readback, so one request at a time shows ~8
// a second; three in flight overlap those waits. Only a newer frame than the one shown replaces it.
const IN_FLIGHT = 3;
let shown = null, shownSeq = 0, nextSeq = 0, frames = [];
async function frameLoop() {
  for (;;) {
    const started = performance.now();
    const seq = ++nextSeq;
    try {
      // JPEG: several times smaller and quicker to encode than PNG.
      const response = await get("/screenshot?format=jpeg&quality=90&scale=" + $("scale").value);
      if (response.ok) {
        const blob = await response.blob();
        if (seq > shownSeq) {
          shownSeq = seq;
          const url = URL.createObjectURL(blob);
          $("frame").src = url;
          if (shown) URL.revokeObjectURL(shown);
          shown = url;
          frames.push(performance.now());
          frames = frames.filter((t) => t > performance.now() - 3000);
          $("fps").textContent = (frames.length / 3).toFixed(1) + " fps";
        }
      }
    } catch (_) { await sleep(1000); }
    // Each loop at most 10 a second, so the three together stay near the client's own rate.
    await sleep(Math.max(0, 100 - (performance.now() - started)));
  }
}

async function statusLoop() {
  for (;;) {
    try {
      const s = await (await get("/status")).json();
      const badge = $("state");
      badge.textContent = s.state || "unknown";
      badge.className = "badge live";
      const p = s.player;
      if (p && p.name) {
        $("who").textContent = `${p.name} · ${p.level} ${p.race} ${p.class_name || p.class}`.replace(/\s+/g, " ");
        $("where").textContent = [p.subzone, p.zone].filter(Boolean).join(", ") +
          (p.map_x != null ? `  (${(p.map_x * 100).toFixed(1)}, ${(p.map_y * 100).toFixed(1)})` : "") +
          (p.dead ? " · dead" : p.combat ? " · in combat" : "");
        bar("hp", p.health, p.health_max);
        bar("pw", p.power, p.power_max);
        $("target").textContent = p.target || "none";
      } else {
        $("who").textContent = s.in_world ? "entering world" : "not in the world";
        $("where").textContent = "";
      }
    } catch (_) {
      $("state").textContent = "client not answering";
      $("state").className = "badge off";
    }
    await sleep(1000);
  }
}

function bar(id, value, max) {
  $(id).style.width = max ? Math.min(100, (100 * value) / max) + "%" : "0";
  $(id + "Text").textContent = max ? `${value} / ${max}` : "–";
}

const NOISY = /^(UPDATE_|COMBAT_LOG|UNIT_AURA|UNIT_POWER|UNIT_HEALTH|ACTIONBAR_UPDATE|SPELL_UPDATE|BAG_UPDATE_COOLDOWN|CURSOR_UPDATE|MINIMAP|WORLD_MAP|CHAT_MSG_ADDON)/;
const entries = [];
async function eventLoop() {
  let since = 0;
  for (;;) {
    try {
      const r = await (await get(`/events?since=${since}&wait_ms=25000&limit=500`)).json();
      since = r.next;
      for (const e of r.events) {
        if (e.event !== "AGENT_LUA" && NOISY.test(e.event)) continue;
        entries.push(e);
      }
      if (entries.length > 600) entries.splice(0, entries.length - 600);
      render();
    } catch (_) { await sleep(2000); }
  }
}

function render() {
  const filter = $("filter").value.trim().toUpperCase();
  const log = $("log");
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.replaceChildren(...entries
    .filter((e) => !filter || (e.event + " " + JSON.stringify(e.args)).toUpperCase().includes(filter))
    .slice(-300)
    .map((e) => {
      const li = document.createElement("li");
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = e.time.toFixed(1);
      const body = document.createElement("span");
      if (e.event === "AGENT_LUA") {
        const [code, ok, error] = e.args;
        body.className = ok ? "lua" : "lua err";
        body.textContent = "lua › " + code + (ok ? "" : "  ✗ " + error);
      } else {
        body.className = "ev";
        const args = e.args.filter((a) => a !== null && a !== "").join(", ");
        body.textContent = e.event + (args ? "  " + args : "");
      }
      li.append(t, body);
      return li;
    }));
  if (atBottom) log.scrollTop = log.scrollHeight;
}

$("filter").addEventListener("input", render);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
for (let i = 0; i < IN_FLIGHT; i++) frameLoop();
statusLoop(); eventLoop();
</script>
</body>
</html>
