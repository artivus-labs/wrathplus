[package]
name = "wrathplus-agent"
version.workspace = true
description = "The client's control port for external agents: Lua, screenshots, events and status over local HTTP"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bevy.workspace = true
wrathplus-app-core = { path = "../wrathplus-app-core", default-features = false }
wrathplus-ui = { path = "../wrathplus-ui" }
wrathplus-world = { path = "../wrathplus-world", default-features = false }
wrathplus-app-net = { path = "../wrathplus-app-net", default-features = false }
wrathplus-app-world = { path = "../wrathplus-app-world", default-features = false }
wrathplus-app-ui = { path = "../wrathplus-app-ui", default-features = false }
wrathplus-protocol = { path = "../wrathplus-protocol" }
wrathplus-nav = { path = "../wrathplus-nav" }
mlua = { version = "0.11", features = ["lua51", "vendored"] }
# A small blocking HTTP server on its own threads; the game loop only answers queued requests.
tiny_http = "0.12"
serde_json = "1"
crossbeam-channel = "0.5"
# PNG encoding (and the optional downscale) of screenshots, off the main thread.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
