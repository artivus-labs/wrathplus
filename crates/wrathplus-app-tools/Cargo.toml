[package]
name = "wrathplus-app-tools"
version.workspace = true
description = "The app's dev instruments: debug panel, perf journal, probes and censuses (mostly behind the dev feature)"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `dev` compiles in the instruments; the player build (`scripts/gates.sh`) has no defaults.
default = ["dev"]
# The asset, format and world crates default `dev` on, so they come in without it, forwarded here.
dev = ["wrathplus-assets/dev", "wrathplus-formats/dev", "wrathplus-world/dev", "dep:bevy_egui", "wrathplus-app-core/dev", "wrathplus-app-net/dev", "wrathplus-app-world/dev", "wrathplus-app-ui/dev"]
tracy = ["bevy/trace_tracy"]
# Writes every system's per-run span to `trace-<ts>.json` in the cwd.
trace_chrome = ["bevy/trace_chrome"]
# Test helpers that other crates' tests need (a `#[cfg(test)]` item is invisible across crates);
# the crate split's root enables it for its tests.
test-support = ["wrathplus-app-core/test-support", "wrathplus-app-net/test-support", "wrathplus-app-world/test-support", "wrathplus-app-ui/test-support"]

[dependencies]
wrathplus-app-core = { path = "../wrathplus-app-core", default-features = false }
wrathplus-app-net = { path = "../wrathplus-app-net", default-features = false }
wrathplus-app-world = { path = "../wrathplus-app-world", default-features = false }
wrathplus-app-ui = { path = "../wrathplus-app-ui", default-features = false }
wrathplus-ui = { path = "../wrathplus-ui" }
bevy.workspace = true
wgpu.workspace = true
bevy_egui = { version = "0.39", optional = true }
bytemuck = { version = "1", features = ["derive"] }
# `getrusage` for perf CPU time; `localtime_r` for the log stamp; the audio clock and render
# thread's realtime policy on macOS.
libc = "0.2"
# PNG encoding only: the macOS cursor's NSImage data and screenshots.
image = { version = "0.25", default-features = false, features = ["png"] }
# Thread-to-ECS channels: crossbeam's `Receiver` is `Sync`, so it is a resource without a mutex.
crossbeam-channel = "0.5"
wrathplus-assets = { path = "../wrathplus-assets", default-features = false }
wrathplus-formats = { path = "../wrathplus-formats", default-features = false }
wrathplus-protocol = { path = "../wrathplus-protocol" }
wrathplus-world = { path = "../wrathplus-world", default-features = false }
# The CVar diff persisted in `benilla-config/config.toml`.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Collision for our kinematic character controller; 0.6 targets Bevy 0.18, 0.7 moves to 0.19.
avian3d = "0.6"

# Windows CPU clocks for `perf::clock`; `GetLocalTime` for the log stamp (`ui_chat::logging`); the
# layout's virtual keys for `bindings::layout`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
wrathplus-app-core = { path = "../wrathplus-app-core", default-features = false, features = ["test-support"] }
wrathplus-app-net = { path = "../wrathplus-app-net", default-features = false, features = ["test-support"] }
wrathplus-app-world = { path = "../wrathplus-app-world", default-features = false, features = ["test-support"] }
wrathplus-app-ui = { path = "../wrathplus-app-ui", default-features = false, features = ["test-support"] }
