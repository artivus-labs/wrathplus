[package]
name = "wrathplus-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy AssetSource + AssetLoaders over the WoW 3.3.5a MPQ patch chain"

[lints]
workspace = true

[features]
# The dev/player seam, on by default. `wrathplus-formats` comes in without default features and its
# `dev` is forwarded here, or unification would put it back in a player build.
default = ["dev"]
dev = ["wrathplus-formats/dev"]

[dependencies]
anyhow.workspace = true
bevy.workspace = true
wrathplus-formats = { path = "../wrathplus-formats", default-features = false }
# Nearest-neighbour resize of layer BLPs smaller than `LAYER_TEX_SIZE`: texel replication in gamma
# bytes, with no averaging to darken mid-tones.
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
