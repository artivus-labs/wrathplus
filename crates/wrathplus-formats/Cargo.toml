[package]
name = "wrathplus-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WoW 3.3.5a asset-format adapters (MPQ/BLP/DBC/ADT/WDT) and the wrathplus-extract CLI"

[lints]
workspace = true

[features]
# `dev` gates one thing, the project folder (`install::project_folder`), whose fallback bakes this
# source tree's path into the binary. Every dependent takes this crate without default features and
# forwards `dev`, or unification puts the path back into a player build.
default = ["dev"]
dev = []

[dependencies]
anyhow.workspace = true
tracing = "0.1"
clap.workspace = true
wrathplus-adt = { path = "../wrathplus-adt" }
wrathplus-bytes = { path = "../wrathplus-bytes" }
wrathplus-dbc = { path = "../wrathplus-dbc" }
wrathplus-m2 = { path = "../wrathplus-m2" }
wrathplus-mpq = { path = "../wrathplus-mpq" }
wrathplus-blp = { path = "../wrathplus-blp" }
# PNG only: the default `avif` feature would pull in rav1e, a whole AV1 encoder, to write PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }
wrathplus-wdt = { path = "../wrathplus-wdt" }
wrathplus-wmo = { path = "../wrathplus-wmo" }

[dev-dependencies]
glam = "0.31"
