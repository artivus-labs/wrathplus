[package]
name = "wrathplus-app-ui"
version.workspace = true
description = "The app's UI layer: FrameXML hosting, the Lua API and the stock 3.3.5a windows"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `dev` compiles in the instruments; the player build (`scripts/gates.sh`) has no defaults.
default = ["dev"]
# The asset, format and world crates default `dev` on, so they come in without it, forwarded here.
dev = ["wrathplus-assets/dev", "wrathplus-formats/dev", "wrathplus-world/dev", "wrathplus-app-core/dev", "wrathplus-app-net/dev", "wrathplus-app-world/dev"]
tracy = ["bevy/trace_tracy"]
# Writes every system's per-run span to `trace-<ts>.json` in the cwd.
trace_chrome = ["bevy/trace_chrome"]
# Test helpers that other crates' tests need (a `#[cfg(test)]` item is invisible across crates);
# the crate split's root enables it for its tests.
test-support = ["wrathplus-app-core/test-support", "wrathplus-app-net/test-support", "wrathplus-app-world/test-support"]

[dependencies]
wrathplus-app-core = { path = "../wrathplus-app-core", default-features = false }
wrathplus-app-net = { path = "../wrathplus-app-net", default-features = false }
wrathplus-app-world = { path = "../wrathplus-app-world", default-features = false }
anyhow.workspace = true
# The EditBox clipboard, on the main thread as NSPasteboard requires; bevy_egui's 3.x.
arboard = "3"
wrathplus-ui = { path = "../wrathplus-ui" }
bevy.workspace = true
bytemuck = { version = "1", features = ["derive"] }
# Compiles `assets/ui` into the binary, so the interface loads on a machine without the source.
include_dir = "0.7"
# `getrusage` for perf CPU time; `localtime_r` for the log stamp; the audio clock and render
# thread's realtime policy on macOS.
libc = "0.2"
# PNG encoding only: the macOS cursor's NSImage data and screenshots.
image = { version = "0.25", default-features = false, features = ["png"] }
# Thread-to-ECS channels: crossbeam's `Receiver` is `Sync`, so it is a resource without a mutex.
crossbeam-channel = "0.5"
wrathplus-assets = { path = "../wrathplus-assets", default-features = false }
wrathplus-formats = { path = "../wrathplus-formats", default-features = false }
wrathplus-protocol = { path = "../wrathplus-protocol" }
wrathplus-world = { path = "../wrathplus-world", default-features = false }
# The layout's unshifted character per key (`KeyEventExtModifierSupplement`), which bevy's
# `KeyboardInput` drops; bevy_winit's own 0.30, whose features it sets.
winit = { version = "0.30", default-features = false }
# The gossip greeting's weighted draw, re-rolled per open as in the reference.
rand = "0.8"

# Wayland clipboard over the standard `wl_data_device`; arboard's speaks `wlr-data-control`,
# which GNOME does not implement.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
raw-window-handle = "0.6"
smithay-clipboard = "0.7"

# Windows CPU clocks for `perf::clock`; `GetLocalTime` for the log stamp (`ui_chat::logging`); the
# layout's virtual keys for `bindings::layout`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
wrathplus-blp = { path = "../wrathplus-blp" }
wrathplus-app-core = { path = "../wrathplus-app-core", default-features = false, features = ["test-support"] }
wrathplus-app-net = { path = "../wrathplus-app-net", default-features = false, features = ["test-support"] }
wrathplus-app-world = { path = "../wrathplus-app-world", default-features = false, features = ["test-support"] }
