<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.35" stop-color="#b9dcf2"/>
      <stop offset="0.55" stop-color="#5f8fb8"/>
      <stop offset="0.75" stop-color="#9cc6e6"/>
      <stop offset="1" stop-color="#2b4d73"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b8"/>
      <stop offset="0.4" stop-color="#e8b84a"/>
      <stop offset="0.6" stop-color="#9c6a14"/>
      <stop offset="0.8" stop-color="#f2cd6a"/>
      <stop offset="1" stop-color="#6e4608"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="1" stop-color="#8a5a10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
      <feFlood flood-color="#6fc3ff" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bevel" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant="0.9" specularExponent="22" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="235" elevation="48"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.75" k4="0"/>
    </filter>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="7" result="o"/>
      <feFlood flood-color="#000814" flood-opacity="0.85"/>
      <feComposite in2="o" operator="in"/>
    </filter>
  </defs>

  <!-- icicles hanging from the baseline -->
  <g id="icicles" fill="url(#ice)" opacity="0.95" filter="url(#bevel)">
    <polygon points="192,318 204,318 198,378"/>
    <polygon points="247,318 262,318 254,402"/>
    <polygon points="303,318 314,318 308,360"/>
    <polygon points="362,318 379,318 370,418"/>
    <polygon points="424,318 434,318 429,366"/>
    <polygon points="482,318 497,318 490,392"/>
    <polygon points="549,318 559,318 554,356"/>
    <polygon points="618,318 633,318 625,396"/>
    <polygon points="690,318 700,318 695,362"/>
    <polygon points="757,318 772,318 764,404"/>
    <polygon points="822,318 832,318 827,370"/>
  </g>

  <!-- shadow pass -->
  <g filter="url(#shadow)" font-family="Copperplate" font-weight="bold" text-anchor="middle">
    <text x="512" y="320" font-size="138" letter-spacing="2"><tspan>WRATH</tspan><tspan font-size="110" dx="10">PLUS</tspan></text>
  </g>

  <!-- letters: gold rim, then the faces -->
  <g filter="url(#glow)" font-family="Copperplate" font-weight="bold" text-anchor="middle">
    <text x="512" y="320" font-size="138" letter-spacing="2" fill="none" stroke="url(#rim)" stroke-width="12" stroke-linejoin="round"><tspan>WRATH</tspan><tspan font-size="110" dx="10">PLUS</tspan></text>
    <text x="512" y="320" font-size="138" letter-spacing="2" filter="url(#bevel)"><tspan fill="url(#ice)">WRATH</tspan><tspan font-size="110" dx="10" fill="url(#gold)">PLUS</tspan></text>
  </g>
</svg>
