[package]
name = "wrathplus-manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "x11", "wayland", "image-without-codecs", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
wrathplus-ui = { path = "../wrathplus-ui" }
wrathplus-formats = { path = "../wrathplus-formats", default-features = false }
wrathplus-mpq = { path = "../wrathplus-mpq" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.2", features = ["NSData", "NSProcessInfo", "NSString"] }

[lints]
workspace = true
