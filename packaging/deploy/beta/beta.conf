# WrathPlus open-beta realm: deployment settings (no secrets). Sourced by the scripts here.
# A host-local /etc/wrathplus-beta/beta.conf, if present, is sourced afterwards and wins.

# Layout on the box.
ROOT=/srv/wrathplus
REPO="$ROOT/repo"                      # this repository (scripts + packaging/server recipe)
SRC="$ROOT/src"                        # pinned core fork and third-party modules
CORE="$SRC/azerothcore-wotlk"          # ACORE_SOURCE; mod-playerbots inside modules/
CONTEXT="$ROOT/build-context/modules"  # MODULE_SOURCES: copies of the selected modules only
SERVER_DATA="$ROOT/server-data"        # dbc/ maps/ vmaps/ mmaps/ Cameras/ Buildings/
MODULE_CONFIG="$ROOT/module-config"    # optional private .conf overrides (empty on the beta)
BACKUPS=/var/backups/wrathplus
BACKUP_DAYS=7

# Compose project and image (amd64 build of the same recipe as the Manager's local realm).
PROJECT=wrathplus-beta
IMAGE=wrathplus/playerbots:amd64-beta
BUILD_JOBS=4

# Account service (services/account): Bun 1.4 or newer is required by its OAuth library.
BUN_VERSION=1.4.4

# Realm list row written after every bootstrap (runtime.sh writes the local realm's values).
REALM_NAME="WrathPlus Beta"
REALM_ADDRESS=wrathplus.artivus.com.au
REALM_PORT=8085

# Pins: the same sources the Manager's local realm builds (packaging/server/README.md).
CORE_URL=https://github.com/mod-playerbots/azerothcore-wotlk.git
CORE_REV=93333d6a9eb00fdf0179adde30da3c17618207d6
PLAYERBOTS_URL=https://github.com/mod-playerbots/mod-playerbots.git
PLAYERBOTS_REV=05a1f6fceb8a32aa879b13f5f48934c6e46a774c
MULTIBOT_URL=https://github.com/Wishmaster117/mod-multibot-bridge.git
MULTIBOT_REV=9f0e8ba767c65f7959a615f70e61ec0980266780
# Selected modules (bundled = packaging/server/modules). mod-llm-chatter stays off on the beta
# (needs a paid LLM key).
BUNDLED_MODULES="mod-quest-minimap-points mod-atproto-identity mod-party-quest-share mod-agent-nav"
