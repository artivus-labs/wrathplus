# mod-llm-chatter settings for the beta realm (no secrets). realm.sh renders
# $MODULE_CONFIG/mod_llm_chatter.conf from the pinned module's conf/mod_llm_chatter.conf.dist with
# every key below replacing the shipped value (keys the .dist lacks are appended). A host-local
# /etc/wrathplus-beta/llm-chatter.conf, if present, is applied the same way afterwards and wins.
# The worldserver and the bridge read the same rendered file; chatter.sh replaces the database keys
# with the instance credentials. Changes need `wrathplus-realm restart`.
#
# Everything is gated on real players: ambient, proximity and party chatter run only around an
# online, non-bot player, so 400 random bots alone cost nothing. llm-guard caps the month's spend
# regardless of these rates (README: LLM chatter).

# --- Provider: Claude Haiku 5.5 through llm-guard -----------------------------------------------
LLMChatter.Enable = 1
LLMChatter.Provider = anthropic
LLMChatter.Model = claude-haiku-5-5
# Without this the bridge's quick-analysis calls default to Haiku 4.5, which llm-guard refuses.
LLMChatter.QuickAnalyze.Model = claude-haiku-5-5
# The bridge never holds the real key: llm-guard (ANTHROPIC_BASE_URL) replaces it with the key in
# /etc/wrathplus-beta/llm-chatter.env. The bridge refuses to start with an empty key.
LLMChatter.Anthropic.ApiKey = proxied-by-llm-guard
# Haiku 5.5 thinks by default; chat lines need none (and thinking tokens bill as output).
LLMChatter.Anthropic.Thinking = disabled
# Haiku 5.5 rejects a non-default temperature with a 400. Key added by
# llm-chatter-anthropic-temperature.patch: send no temperature at all.
LLMChatter.Anthropic.SendTemperature = 0
# No live probe at bridge start: at the monthly cap the probe's 429 would fail the preflight and
# restart the bridge in a loop. A missing key stops llm-guard itself, so it still shows.
LLMChatter.HealthCheck.LLMProbe = 0

# --- Party members: talk, and answer the player -------------------------------------------------
# Replies to the player's party messages (PlayerMsg*) keep the module defaults; the unprompted
# triggers below take upstream's quieter preset (conf/presets) so party chat stays conversation,
# not commentary on every spell and kill.
LLMChatter.GroupChatter.Enable = 1
LLMChatter.GroupChatter.IdleChance = 7
LLMChatter.GroupChatter.KillChanceNormal = 8
LLMChatter.GroupChatter.SpellCastChance = 5
LLMChatter.GroupChatter.NearbyObjectChance = 8
LLMChatter.GroupChatter.QuestAcceptChance = 25
LLMChatter.GroupChatter.QuestObjectiveChance = 20
LLMChatter.GroupChatter.QuestCompleteChance = 40
LLMChatter.GroupChatter.LootChanceGreen = 15
# Pre-generated combat lines are paid for whether or not they are ever said.
LLMChatter.GroupChatter.PreCacheEnable = 0

# --- NPCs and nearby bots: answer a player's /say, otherwise speak rarely -----------------------
# Directed replies (a player /say or emote at an NPC or ungrouped bot) keep the module defaults.
# Unprompted nearby scenes: a scan every 90 s instead of 30 s, at a lower chance.
LLMChatter.ProximityChatter.Enable = 1
LLMChatter.ProximityChatter.ScanIntervalSeconds = 90
LLMChatter.ProximityChatter.OutdoorScanIntervalSeconds = 90
LLMChatter.ProximityChatter.InstanceScanIntervalSeconds = 90
LLMChatter.ProximityChatter.Chance = 10
LLMChatter.ProximityChatter.OutdoorChance = 10
LLMChatter.ProximityChatter.InstanceChance = 25
LLMChatter.ProximityChatter.ConversationChance = 25
LLMChatter.ProximityChatter.FightReactions.DuelChance = 20
LLMChatter.ProximityChatter.FightReactions.PvPChance = 15

# --- General channel: answers players, ambient chatter rare -------------------------------------
# Bots answer a real player's General message (module default); unprompted zone chatter is
# checked every 2 minutes at 5 % (default 30 s at 15 %), with no extra rate in capitals.
LLMChatter.GeneralChannel.Enable = 1
LLMChatter.GeneralChat.PlayerReplyEnable = 1
LLMChatter.TriggerIntervalSeconds = 120
LLMChatter.TriggerChance = 5
LLMChatter.CityChatterMultiplier = 1
LLMChatter.ConversationChance = 20
LLMChatter.EventReactionChance = 10

# --- Guild: only guilds with an online real player; ambient guild talk at upstream's quieter rate
LLMChatter.GuildChatter.Chance = 8
